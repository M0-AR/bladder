<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Bladder Vision</title>
  <desc id="desc">Open research platform for cystoscopy AI. Cystoscopy AI, with the evidence attached. MIT licensed. Research use only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041016"/>
      <stop offset=".55" stop-color="#071d24"/>
      <stop offset="1" stop-color="#041016"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="55%">
      <stop offset="0" stop-color="#19c7ad" stop-opacity=".22"/>
      <stop offset="1" stop-color="#19c7ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffb4a6"/>
      <stop offset=".38" stop-color="#c95d62"/>
      <stop offset=".72" stop-color="#5a2030"/>
      <stop offset="1" stop-color="#1a0810"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="clip"><rect width="1280" height="640" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <rect width="1280" height="640" fill="url(#grid)"/>
    <rect width="1280" height="640" fill="url(#glow)"/>
    <g transform="translate(930 305)">
      <circle r="215" fill="none" stroke="#5eead4" stroke-opacity=".12"/>
      <circle r="172" fill="none" stroke="#5eead4" stroke-opacity=".16" stroke-dasharray="4 10"/>
      <circle r="132" fill="url(#blob)"/>
      <g fill="none" stroke="#5eead4" stroke-opacity=".22">
        <path d="M-118-42  -52-110  32-92  104-28  76 54  4 108  -78 82  -122 22Z"/>
        <path d="M-118-42  32-92  76 54  -78 82Z"/>
        <path d="M-52-110  104-28  -122 22Z"/>
        <path d="M32-92  4 108"/>
        <path d="M104-28  -78 82"/>
      </g>
      <g fill="#5eead4">
        <circle cx="-118" cy="-42" r="3.2"/>
        <circle cx="-52" cy="-110" r="2.4"/>
        <circle cx="32" cy="-92" r="2.6"/>
        <circle cx="76" cy="54" r="2.2"/>
        <circle cx="4" cy="108" r="2.8"/>
        <circle cx="-122" cy="22" r="2.2"/>
      </g>
      <g fill="#ff7d6b">
        <circle cx="104" cy="-28" r="6"/>
        <circle cx="-78" cy="82" r="4.2"/>
      </g>
      <circle cx="104" cy="-28" r="14" fill="none" stroke="#ff7d6b" stroke-opacity=".4"/>
      <g stroke="#5eead4" stroke-opacity=".18">
        <path d="M-215 0H215" stroke-dasharray="2 8"/>
        <path d="M0-215V215" stroke-dasharray="2 8"/>
      </g>
    </g>
    <g font-family="Georgia, 'Times New Roman', serif" fill="#f7f4ed">
      <text x="84" y="148" font-size="19" letter-spacing="4" fill="#5eead4" font-family="ui-monospace, Menlo, monospace">OPEN RESEARCH PLATFORM · MIT</text>
      <text x="80" y="278" font-size="104" letter-spacing="-3">Bladder Vision</text>
      <text x="84" y="348" font-size="34" fill="#c4d5da" font-family="Manrope, system-ui, sans-serif" letter-spacing="-.5">Cystoscopy AI, with the evidence attached.</text>
      <text x="84" y="404" font-size="19" fill="#8fa8af" font-family="Manrope, system-ui, sans-serif">From annotated video to auditable metrics — plus a 3D learning world.</text>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#c9e6e2">
      <rect x="84" y="462" width="196" height="40" rx="20" fill="#ffffff" fill-opacity=".04" stroke="#5eead4" stroke-opacity=".24"/>
      <text x="106" y="487">frames → metrics</text>
      <rect x="294" y="462" width="176" height="40" rx="20" fill="#ffffff" fill-opacity=".04" stroke="#5eead4" stroke-opacity=".24"/>
      <text x="316" y="487">3D + quiz</text>
      <rect x="484" y="462" width="236" height="40" rx="20" fill="#ffffff" fill-opacity=".04" stroke="#ff7d6b" stroke-opacity=".35"/>
      <text x="506" y="487" fill="#ffb4a6">research use only</text>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6f8b92">
      <text x="84" y="566">github.com/M0-AR/bladder</text>
      <text x="84" y="588" fill="#ff7d6b">Not a medical device. No clinical validation claimed.</text>
    </g>
  </g>
</svg>